<!doctype html>
<html lang="en" data-banner="omo-ultrawork" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>omo-ultrawork</title>
    <link rel="stylesheet" href="banner.css" />
    <script>
      document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";
    </script>
  </head>
  <body>
    <div class="grid meta">
      <div class="idx"><b>06</b> / 08</div>
      <div>wows-omp-plugins</div>
      <div>/ultrawork</div>
    </div>
    <div class="rule top"></div>

    <div class="grid body">
      <div class="lead">
        <div class="title">omo-ultrawork<span class="acc">.</span></div>
        <div class="tag">Type ulw and the agent delivers the request end to end, backing each success criterion with evidence.</div>
      </div>
      <div class="fig">
        <svg width="484" height="196" viewBox="0 0 484 196" role="img" aria-label="ulw keyword injects the directive, the agent delivers end to end, and each success criterion is backed by evidence">
          <defs>
            <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
              <path class="d-head" d="M0,0 L10,5 L0,10 z" />
            </marker>
            <marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path class="d-head-accent" d="M0,0 L10,5 L0,10 z" />
            </marker>
          </defs>

          <!-- one message: keyword -> directive -> deliver -> evidence -->
          <rect class="d-box" x="0.5" y="0.5" width="106" height="48" />
          <text class="d-num" x="10" y="20">01</text>
          <text class="d-lbl" x="10" y="40">ulw</text>
          <rect class="d-box" x="126.5" y="0.5" width="106" height="48" />
          <text class="d-num" x="136" y="20">02</text>
          <text class="d-lbl" x="136" y="40">Directive</text>
          <rect class="d-box" x="252.5" y="0.5" width="106" height="48" />
          <text class="d-num" x="262" y="20">03</text>
          <text class="d-lbl" x="262" y="40">Deliver</text>
          <rect class="d-end" x="378" y="0" width="106" height="49" />
          <text class="d-num" x="388" y="20">04</text>
          <text class="d-end-lbl" x="388" y="40">Evidence</text>
          <line class="d-link" x1="107" y1="25" x2="125" y2="25" marker-end="url(#head)" />
          <line class="d-link" x1="233" y1="25" x2="251" y2="25" marker-end="url(#head)" />
          <line class="d-link" x1="359" y1="25" x2="377" y2="25" marker-end="url(#head)" />

          <!-- persistent mode: every message gets ultrawork -->
          <path class="d-accent" d="M431,49 V72 H53 V51" marker-end="url(#head-accent)" />
          <rect class="d-mask" x="138" y="62" width="208" height="20" />
          <text class="d-mono accent" x="242" y="77" text-anchor="middle">/ulw · every message</text>

          <!-- each success criterion backed by observed evidence -->
          <g transform="translate(0,104)">
            <rect class="d-box" x="0.5" y="2.5" width="13" height="13" />
            <text class="d-mono" x="24" y="14">criterion</text>
            <line class="d-link" x1="118" y1="9" x2="196" y2="9" marker-end="url(#head)" />
            <rect class="d-fill-accent" x="204" y="2" width="14" height="14" />
            <text class="d-mono" x="228" y="14">evidence</text>

            <rect class="d-box" x="0.5" y="32.5" width="13" height="13" />
            <text class="d-mono" x="24" y="44">criterion</text>
            <line class="d-link" x1="118" y1="39" x2="196" y2="39" marker-end="url(#head)" />
            <rect class="d-fill-accent" x="204" y="32" width="14" height="14" />
            <text class="d-mono" x="228" y="44">evidence</text>

            <rect class="d-box" x="0.5" y="62.5" width="13" height="13" />
            <text class="d-mono" x="24" y="74">criterion</text>
            <line class="d-link" x1="118" y1="69" x2="196" y2="69" marker-end="url(#head)" />
            <rect class="d-fill-accent" x="204" y="62" width="14" height="14" />
            <text class="d-mono" x="228" y="74">evidence</text>

            <path class="d-accent" d="M314,9 V69 M314,39 H322" />
            <text class="d-lbl accent" x="332" y="28">Delivered</text>
            <text class="d-mono" x="332" y="52">observed on the</text>
            <text class="d-mono" x="332" y="72">real surface</text>
          </g>
        </svg>
      </div>
    </div>

    <div class="rule bottom"></div>
    <div class="grid foot">
      <div class="status">Ultrawork mode</div>
      <div class="legend">
        <span class="outline">Criterion</span>
        <span class="accent">Evidence</span>
      </div>
    </div>
  </body>
</html>
