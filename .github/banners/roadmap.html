<!doctype html>
<html lang="en" data-banner="roadmap" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>roadmap</title>
    <link rel="stylesheet" href="banner.css" />
    <style>
      .fig {
        padding-top: 22px;
      }
      .g-axis {
        stroke: var(--ink-3);
        stroke-width: 1;
      }
      .g-month {
        font: 500 15px var(--mono);
        letter-spacing: 0.04em;
        fill: var(--ink-3);
      }
      .g-lane {
        font: 700 17px var(--display);
        letter-spacing: -0.01em;
        fill: var(--ink);
      }
      .g-state {
        font: 500 15px var(--mono);
        fill: var(--ink-2);
      }
      .g-state.accent {
        fill: var(--accent);
      }
      .g-id {
        font: 600 15px var(--mono);
        fill: var(--ink);
      }
      .g-id.on {
        fill: var(--paper);
      }
      .g-plan {
        fill: none;
        stroke: var(--ink);
        stroke-width: 1;
      }
      .g-rest {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.5;
      }
      .g-target {
        stroke: var(--accent);
        stroke-width: 2;
      }
      .g-now {
        stroke: var(--accent);
        stroke-width: 1.5;
        stroke-dasharray: 3 3;
      }
      .g-adr {
        fill: var(--ink);
      }
      .legend .target::before {
        width: 2px;
        height: 14px;
      }
    </style>
    <script>
      document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";
    </script>
  </head>
  <body>
    <div class="grid meta">
      <div class="series">wows-omp-plugins</div>
      <div>/roadmap</div>
    </div>
    <div class="rule top"></div>

    <div class="grid body">
      <div class="lead">
        <div class="title">roadmap<span class="acc">.</span></div>
        <div class="tag">The planning layer above your plans and tasks: rounds, stages and decisions kept in your repo.</div>
      </div>
      <div class="fig">
        <svg width="484" height="210" viewBox="0 0 484 210" role="img" aria-label="Roadmap timeline: round R1 closed, round R2 active with its stages and a target date, round R3 planned, and ADRs that outlive rounds">
          <!-- time axis -->
          <text class="g-month" x="80" y="12">JUL</text>
          <text class="g-month" x="147" y="12">AUG</text>
          <text class="g-month" x="215" y="12">SEP</text>
          <text class="g-month" x="282" y="12">OCT</text>
          <text class="g-month" x="349" y="12">NOV</text>
          <text class="g-month" x="417" y="12">DEC</text>
          <line class="g-axis" x1="0" y1="22.5" x2="484" y2="22.5" />
          <line class="g-axis" x1="80.5" y1="18" x2="80.5" y2="27" />
          <line class="g-axis" x1="147.5" y1="18" x2="147.5" y2="27" />
          <line class="g-axis" x1="215.5" y1="18" x2="215.5" y2="27" />
          <line class="g-axis" x1="282.5" y1="18" x2="282.5" y2="27" />
          <line class="g-axis" x1="349.5" y1="18" x2="349.5" y2="27" />
          <line class="g-axis" x1="417.5" y1="18" x2="417.5" y2="27" />

          <!-- today -->
          <line class="g-now" x1="318" y1="27" x2="318" y2="190" />
          <text class="g-state accent" x="318" y="207" text-anchor="middle">today</text>

          <!-- R1: closed -->
          <text class="g-lane" x="0" y="47">R1</text>
          <text class="g-state" x="0" y="63">closed</text>
          <rect class="d-fill-mute" x="80" y="34" width="42" height="30" />
          <text class="g-id" x="101" y="54" text-anchor="middle">S01</text>
          <rect class="d-fill-mute" x="126" y="34" width="42" height="30" />
          <text class="g-id" x="147" y="54" text-anchor="middle">S02</text>
          <rect class="d-fill-mute" x="172" y="34" width="42" height="30" />
          <text class="g-id" x="193" y="54" text-anchor="middle">S03</text>

          <!-- R2: active; S05 runs toward its target, S06 waits on it -->
          <text class="g-lane" x="0" y="91">R2</text>
          <text class="g-state accent" x="0" y="107">active</text>
          <rect class="d-fill-mute" x="218" y="78" width="42" height="30" />
          <text class="g-id" x="239" y="98" text-anchor="middle">S04</text>
          <rect class="d-fill-accent" x="264" y="78" width="54" height="30" />
          <text class="g-id on" x="291" y="98" text-anchor="middle">S05</text>
          <rect class="g-rest" x="318" y="78.75" width="22" height="28.5" />
          <line class="g-target" x1="341" y1="72" x2="341" y2="114" />
          <rect class="g-plan" x="346.5" y="78.5" width="41" height="29" />
          <text class="g-id" x="367" y="98" text-anchor="middle">S06</text>

          <!-- R3: planned -->
          <text class="g-lane" x="0" y="135">R3</text>
          <text class="g-state" x="0" y="151">planned</text>
          <rect class="g-plan" x="392.5" y="122.5" width="41" height="29" />
          <text class="g-id" x="413" y="142" text-anchor="middle">S07</text>
          <rect class="g-plan" x="438.5" y="122.5" width="45" height="29" />
          <text class="g-id" x="461" y="142" text-anchor="middle">S08</text>

          <!-- ADRs: decisions that outlive rounds -->
          <text class="g-lane" x="0" y="182">ADR</text>
          <line class="g-axis" x1="80" y1="176.5" x2="484" y2="176.5" />
          <path class="g-adr" d="M96,170 l6,6 l-6,6 l-6,-6 z" />
          <path class="g-adr" d="M150,170 l6,6 l-6,6 l-6,-6 z" />
          <path class="g-adr" d="M232,170 l6,6 l-6,6 l-6,-6 z" />
          <path class="g-adr" d="M290,170 l6,6 l-6,6 l-6,-6 z" />
        </svg>
      </div>
    </div>

    <div class="rule bottom"></div>
    <div class="grid foot">
      <div class="status">Round R2 active · S05 bound</div>
      <div class="legend">
        <span class="accent">Active</span>
        <span class="mute">Closed</span>
        <span class="outline">Planned</span>
        <span class="accent target">Target</span>
      </div>
    </div>
  </body>
</html>
