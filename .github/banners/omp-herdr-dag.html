<!doctype html>
<html lang="en" data-banner="omp-herdr-dag" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>omp-herdr-dag</title>
    <link rel="stylesheet" href="banner.css" />
    <script>
      document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";
    </script>
    <style>
      .p-tab { font: 700 15px var(--mono); letter-spacing: 0.02em; fill: var(--ink); }
      .p-off { font: 500 15px var(--mono); letter-spacing: 0.02em; fill: var(--ink-3); }
      .p-rule { stroke: var(--ink); stroke-width: 1; }
      .p-edge { fill: none; stroke: var(--ink-2); stroke-width: 1.5; }
      .p-crit { fill: none; stroke: var(--accent); stroke-width: 2.5; }
      .p-node { font: 600 17px var(--display); letter-spacing: -0.01em; fill: var(--ink); }
      .p-node.done { fill: var(--ink-2); }
      .p-node.sel { fill: var(--paper); }
      .p-sel { fill: var(--ink); }
      .i-line { fill: none; stroke: var(--ink); stroke-width: 1.5; }
      .i-line.done { stroke: var(--ink-2); stroke-width: 2; }
      .i-line.sel { stroke: var(--paper); }
      .i-fill { fill: var(--ink); }
      .i-fill.sel { fill: var(--paper); }
      .p-key { font: 700 15px var(--mono); fill: var(--accent); }
      .legend.icons span::before { display: none; }
      .legend.icons svg { display: block; overflow: visible; }
    </style>
  </head>
  <body>
    <div class="grid meta">
      <div class="series">wows-omp-plugins</div>
      <div>/dag-pane</div>
    </div>
    <div class="rule top"></div>

    <div class="grid body">
      <div class="lead">
        <div class="title">omp-herdr-dag<span class="acc">.</span></div>
        <div class="tag">A live, read-only graph of what OMP is working on, in a Herdr side pane.</div>
      </div>
      <div class="fig">
        <svg width="484" height="192" viewBox="0 0 484 192" role="img" aria-label="The Herdr side pane in its DAG view: a layered todo graph with done, running and pending nodes, the critical path highlighted and the selected node's direct dependencies listed in the footer">
          <defs>
            <!-- state icons, centred on 0,0 -->
            <path id="ic-done" class="i-line done" d="M-5,0.5 L-1.5,4 L5.5,-4" />
            <g id="ic-pend"><circle class="i-line" r="6" /></g>
            <g id="ic-run"><circle class="i-line" r="6" /><path class="i-fill" d="M0,-6 A6,6 0 0 1 0,6 z" /></g>
          </defs>

          <!-- pane header: view tabs and arrow-key mode -->
          <text class="p-tab" x="0" y="15">DAG</text>
          <line class="p-crit" x1="0" y1="25" x2="28" y2="25" />
          <text class="p-off" x="52" y="15">Tasks</text>
          <text class="p-off" x="484" y="15" text-anchor="end">NODES</text>
          <line class="p-rule" x1="0" y1="34.5" x2="484" y2="34.5" />

          <!-- edges: ordinary dependencies -->
          <path class="p-edge" d="M92,132 H120" />
          <path class="p-edge" d="M210,132 H228 V104 H246" />
          <path class="p-edge" d="M344,98 H358 V132 H372" />
          <!-- edges: critical path -->
          <path class="p-crit" d="M92,64 H120 M210,64 H228 V92 H246 M344,92 H358 V64 H372" />

          <!-- layer 1: done -->
          <use href="#ic-done" x="7" y="64" />
          <text class="p-node done" x="22" y="70">Schema</text>
          <use href="#ic-done" x="7" y="132" />
          <text class="p-node done" x="22" y="138">Config</text>
          <!-- layer 2 -->
          <use href="#ic-done" x="133" y="64" />
          <text class="p-node done" x="148" y="70">Parser</text>
          <use href="#ic-run" x="133" y="132" />
          <text class="p-node" x="148" y="138">Client</text>
          <!-- layer 3: selected running node -->
          <rect class="p-sel" x="246" y="83" width="98" height="30" />
          <circle class="i-line sel" cx="259" cy="98" r="6" />
          <path class="i-fill sel" d="M259,92 A6,6 0 0 1 259,104 z" />
          <text class="p-node sel" x="274" y="104">API</text>
          <!-- layer 4: pending -->
          <use href="#ic-pend" x="385" y="64" />
          <text class="p-node" x="400" y="70">Tests</text>
          <use href="#ic-pend" x="385" y="132" />
          <text class="p-node" x="400" y="138">Docs</text>

          <!-- pane footer: selected node's direct dependencies, critical-path key -->
          <line class="p-rule" x1="0" y1="162.5" x2="484" y2="162.5" />
          <text class="d-mono" x="0" y="187"><tspan class="p-tab">API</tspan>  after Parser, Client</text>
          <text class="d-mono accent" x="484" y="187" text-anchor="end"><tspan class="p-key">p</tspan>  critical path</text>
        </svg>
      </div>
    </div>

    <div class="rule bottom"></div>
    <div class="grid foot">
      <div class="status">displayTiming · plan-execution</div>
      <div class="legend icons">
        <span><svg aria-hidden="true" width="14" height="14" viewBox="-7 -7 14 14"><use href="#ic-done" /></svg>Done</span>
        <span><svg aria-hidden="true" width="14" height="14" viewBox="-7 -7 14 14"><use href="#ic-run" /></svg>Running</span>
        <span><svg aria-hidden="true" width="14" height="14" viewBox="-7 -7 14 14"><use href="#ic-pend" /></svg>Pending</span>
        <span><svg aria-hidden="true" width="18" height="14" viewBox="0 0 18 14"><line class="p-crit" x1="0" y1="7" x2="18" y2="7" /></svg>Critical path</span>
      </div>
    </div>
  </body>
</html>
