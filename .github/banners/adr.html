<!doctype html>
<html lang="en" data-banner="adr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>adr</title>
    <link rel="stylesheet" href="banner.css" />
    <script>
      document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";
    </script>
  </head>
  <body>
    <div class="grid meta">
      <div class="idx"><b>01</b> / 08</div>
      <div>wows-omp-plugins</div>
      <div>/adr</div>
    </div>
    <div class="rule top"></div>

    <div class="grid body">
      <div class="lead">
        <div class="title">adr<span class="acc">.</span></div>
        <div class="tag">Architecture decisions that stay in your repository, changed by the agent only through dedicated tools.</div>
      </div>
      <div class="fig">
        <svg width="484" height="196" viewBox="0 0 484 196" role="img" aria-label="Interview, proposed, your call, accepted lifecycle with supersession, ADR files kept in docs/adr">
          <defs>
            <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
              <path class="d-head" d="M0,0 L10,5 L0,10 z" />
            </marker>
            <marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path class="d-head-accent" d="M0,0 L10,5 L0,10 z" />
            </marker>
          </defs>

          <!-- lifecycle: interview -> proposed -> your call -> accepted -->
          <rect class="d-box" x="0.5" y="0.5" width="106" height="48" />
          <text class="d-num" x="10" y="20">01</text>
          <text class="d-lbl" x="10" y="40">Interview</text>
          <rect class="d-box" x="126.5" y="0.5" width="106" height="48" />
          <text class="d-num" x="136" y="20">02</text>
          <text class="d-lbl" x="136" y="40">Proposed</text>
          <rect class="d-box" x="252.5" y="0.5" width="106" height="48" />
          <text class="d-num" x="262" y="20">03</text>
          <text class="d-lbl" x="262" y="40">Your call</text>
          <rect class="d-end" x="378" y="0" width="106" height="49" />
          <text class="d-num" x="388" y="20">04</text>
          <text class="d-end-lbl" x="388" y="40">Accepted</text>
          <line class="d-link" x1="107" y1="25" x2="125" y2="25" marker-end="url(#head)" />
          <line class="d-link" x1="233" y1="25" x2="251" y2="25" marker-end="url(#head)" />
          <line class="d-link" x1="359" y1="25" x2="377" y2="25" marker-end="url(#head)" />

          <!-- an accepted ADR is never rewritten: supersede starts a new interview -->
          <path class="d-accent" d="M431,49 V72 H53 V51" marker-end="url(#head-accent)" />
          <rect class="d-mask" x="192" y="62" width="100" height="20" />
          <text class="d-mono accent" x="242" y="77" text-anchor="middle">supersede</text>

          <!-- ADR files in docs/adr/, one per decision, filled by status -->
          <g transform="translate(0,112)">
            <rect class="d-box" x="0.5" y="0.5" width="35" height="47" />
            <rect class="d-fill-accent" x="64" y="0" width="36" height="48" />
            <rect class="d-fill-mute" x="128" y="0" width="36" height="48" />
            <rect class="d-fill-accent" x="192" y="0" width="36" height="48" />
            <rect class="d-fill-tint" x="256" y="0" width="36" height="48" />

            <text class="d-mono" x="18" y="74" text-anchor="middle">0001</text>
            <text class="d-mono" x="82" y="74" text-anchor="middle">0002</text>
            <text class="d-mono" x="146" y="74" text-anchor="middle">0003</text>
            <text class="d-mono" x="210" y="74" text-anchor="middle">0004</text>
            <text class="d-mono" x="274" y="74" text-anchor="middle">0005</text>

            <text class="d-lbl accent" x="326" y="16">docs/adr/</text>
            <text class="d-mono" x="326" y="40">MADR 4.0</text>
            <text class="d-mono" x="326" y="60">tools only</text>
          </g>
        </svg>
      </div>
    </div>

    <div class="rule bottom"></div>
    <div class="grid foot">
      <div class="status">Open decisions in every turn</div>
      <div class="legend">
        <span class="accent">Accepted</span>
        <span class="tint">Proposed</span>
        <span class="mute">Deprecated</span>
        <span class="outline">Superseded</span>
      </div>
    </div>
  </body>
</html>
