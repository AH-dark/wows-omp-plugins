<!doctype html>
<html lang="en" data-banner="audit-goal" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>audit-goal</title>
    <link rel="stylesheet" href="banner.css" />
    <style>
      /* ledger specimen: one row per audit round, closing on the recorded conclusion */
      .ledger {
        width: 100%;
        border-collapse: collapse;
        font: 500 16px / 1 var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .ledger th,
      .ledger td {
        height: 28px;
        padding: 0;
        text-align: right;
        vertical-align: middle;
      }
      .ledger th:first-child,
      .ledger td:first-child {
        width: 60px;
        text-align: left;
      }
      .ledger th {
        font: 600 15px / 1 var(--display);
        letter-spacing: -0.005em;
        color: var(--ink-2);
        border-bottom: 1px solid var(--ink);
      }
      .ledger tbody td {
        border-bottom: 1px solid var(--ink-3);
        color: var(--ink);
      }
      .ledger .zero {
        color: var(--ink-3);
      }
      .ledger .run {
        color: var(--ink-3);
      }
      .ledger .run.on {
        color: var(--accent);
        font-weight: 700;
      }
      .ledger tfoot td {
        height: 34px;
        border-top: 1px solid var(--ink);
        text-align: left;
      }
      .verdict {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        color: var(--accent);
      }
      .verdict::before {
        content: "";
        width: 10px;
        height: 10px;
        background: var(--accent);
      }
      .verdict span {
        margin-left: auto;
        font-weight: 500;
        color: var(--ink-2);
      }
    </style>
    <script>
      document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";
    </script>
  </head>
  <body>
    <div class="grid meta">
      <div class="series">wows-omp-plugins</div>
      <div>/audit</div>
    </div>
    <div class="rule top"></div>

    <div class="grid body">
      <div class="lead">
        <div class="title">audit-goal<span class="acc">.</span></div>
        <div class="tag">Audits and fixes your code in rounds, recording each in a ledger, until the audit converges.</div>
      </div>
      <div class="fig">
        <div class="fig-label">Ledger</div>
        <table class="ledger" aria-label="Audit ledger: findings per round by severity until threshold convergence">
          <thead>
            <tr><th>Round</th><th>Critical</th><th>Major</th><th>Minor</th><th>Picky</th><th>Clean</th></tr>
          </thead>
          <tbody>
            <tr><td>R1</td><td>2</td><td>5</td><td>7</td><td>3</td><td class="run">0/2</td></tr>
            <tr><td>R2</td><td class="zero">0</td><td>2</td><td>4</td><td>2</td><td class="run">0/2</td></tr>
            <tr><td>R3</td><td class="zero">0</td><td class="zero">0</td><td>3</td><td>1</td><td class="run on">1/2</td></tr>
            <tr><td>R4</td><td class="zero">0</td><td class="zero">0</td><td>1</td><td>2</td><td class="run on">2/2</td></tr>
          </tbody>
          <tfoot>
            <tr><td colspan="6"><div class="verdict">threshold-convergence<span>recorded</span></div></td></tr>
          </tfoot>
        </table>
      </div>
    </div>

    <div class="rule bottom"></div>
    <div class="grid foot">
      <div class="status">Audit 4/5 · standard</div>
      <div>Exit: 2 rounds, no Critical/Major</div>
    </div>
  </body>
</html>
