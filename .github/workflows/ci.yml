name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify, e.g. the release PR branch
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Decide test scope
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: scope
        env:
          RELEASE_PR_REF: ${{ inputs.ref }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        # Types and tests are skipped when they would re-test code main's CI already covers:
        # the release PR and its merge only bump versions and changelogs, and README, REFERENCE,
        # CHANGELOG, CONTRIBUTING and AGENTS.md files and the README banners in .github/banners/
        # are read by no test. Lint still runs, because Biome checks the banner HTML and CSS.
        run: |
          tests=true
          if [ -n "$RELEASE_PR_REF" ]; then
            tests=false
          elif [ "$GITHUB_EVENT_NAME" = push ] && [[ "$COMMIT_MESSAGE" == "chore: release main"* ]]; then
            tests=false
          elif git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE...$HEAD" | grep -qvE '(^|/)((README|REFERENCE)(\.[A-Za-z-]+)?|CHANGELOG|CONTRIBUTING|AGENTS)\.md$|^\.github/banners/'; then
              tests=false
            fi
          fi
          echo "tests=$tests" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint and catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check-catalog

  test:
    name: Types and tests (omp ${{ matrix.omp }})
    needs: scope
    if: needs.scope.outputs.tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `locked` is the version in bun.lock; 18.10.4 is the oldest host the plugins support.
        omp: [locked, 18.10.4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install omp ${{ matrix.omp }}
        if: matrix.omp != 'locked'
        run: bun add --dev "@oh-my-pi/pi-coding-agent@${{ matrix.omp }}"
      - run: bun run check-types
      - run: bun run test
